<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="语音记账">
  <title>语音记账</title>
  <meta name="description" content="点一下，说出消费，确认后保存在这台手机。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    :root{--ink:#172033;--muted:#6e7c91;--line:#e5eaf1;--blue:#2f6bff;--blue-dark:#2154d7;--blue-soft:#e9f0ff;--surface:#fff;--bg:#f5f7fb}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:radial-gradient(circle at 100% 0%,rgba(47,107,255,.09),transparent 34%),var(--bg)}button,input{font:inherit}button{cursor:pointer}.app{width:min(100%,520px);min-height:100vh;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(42px + env(safe-area-inset-bottom))}.row{display:flex;align-items:center;justify-content:space-between}.topbar{margin-bottom:18px}.eyebrow{margin:0 0 4px;color:var(--muted);font-size:12px;font-weight:650;letter-spacing:.04em}h1,h2,p{margin-top:0}.topbar h1{margin:0;font-size:27px;letter-spacing:-.04em}.privacy{width:42px;height:42px;border:0;border-radius:15px;color:var(--blue);background:var(--blue-soft);font-weight:750}.summary{position:relative;overflow:hidden;min-height:176px;padding:21px;border-radius:27px;color:#fff;background:linear-gradient(145deg,#326fff,#1c4fcf 70%,#173f9f);box-shadow:0 18px 45px rgba(37,87,203,.22)}.summary:after{content:"";position:absolute;right:-58px;bottom:-80px;width:190px;height:190px;border:38px solid rgba(255,255,255,.09);border-radius:50%}.summary-head{font-size:13px;opacity:.78}.summary>strong{position:relative;z-index:1;display:block;margin:17px 0 20px;font-size:clamp(34px,10vw,46px);line-height:1;letter-spacing:-.055em}.chips{position:relative;z-index:1;display:flex;gap:8px;overflow:hidden}.chips span{flex:0 0 auto;padding:7px 10px;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:rgba(255,255,255,.1);font-size:11px;white-space:nowrap}.voice{position:relative;margin:18px 0;padding:26px 18px 20px;overflow:hidden;text-align:center;border:1px solid rgba(224,230,240,.9);border-radius:27px;background:rgba(255,255,255,.92);box-shadow:0 13px 35px rgba(38,50,71,.07)}.rings{position:absolute;inset:0;pointer-events:none}.rings i{position:absolute;top:68px;left:50%;width:96px;height:96px;border:1px solid rgba(47,107,255,.15);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.75)}.listening .rings i{animation:ripple 2s infinite}.listening .rings i:nth-child(2){animation-delay:.6s}.listening .rings i:nth-child(3){animation-delay:1.2s}@keyframes ripple{0%{opacity:.65;transform:translate(-50%,-50%) scale(.8)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.85)}}.mic{position:relative;z-index:1;width:86px;height:86px;border:9px solid #e9efff;border-radius:50%;color:#fff;background:linear-gradient(145deg,#4b82ff,#2457dc);box-shadow:0 12px 25px rgba(47,107,255,.28),inset 0 1px rgba(255,255,255,.4)}.mic span{font-size:26px}.listening .mic{background:linear-gradient(145deg,#ff6f72,#d94754)}.listening .mic span{font-size:18px}.voice h2{margin:17px 0 5px;font-size:18px}.voice p{margin-bottom:14px;color:var(--muted);font-size:13px}.manual{border:0;padding:8px 12px;color:var(--blue);background:transparent;font-size:13px;font-weight:700}.records{padding:18px 18px 5px;border:1px solid var(--line);border-radius:27px;background:var(--surface)}.section-title{margin-bottom:10px}.section-title h2{margin:0;font-size:17px}.section-title span{color:var(--muted);font-size:12px}.record{display:flex;align-items:center;gap:12px;min-height:70px;border-top:1px solid #edf0f5}.record:first-child{border-top:0}.badge{display:grid;flex:0 0 auto;width:38px;height:38px;place-items:center;border-radius:13px;color:#2f67dc;background:#eaf1ff;font-size:12px;font-weight:750}.c-餐饮{color:#db6b28;background:#fff0df}.c-交通{color:#2d70d5;background:#e8f2ff}.c-购物{color:#ae4cc8;background:#f7eaff}.c-娱乐{color:#d34f7d;background:#ffeaf1}.c-居住{color:#258768;background:#e3f6ef}.c-医疗{color:#d75050;background:#ffe8e8}.c-学习{color:#7662c9;background:#efebff}.record-copy{min-width:0;flex:1}.record-copy strong,.record-copy span{display:block}.record-copy strong{overflow:hidden;margin-bottom:5px;font-size:14px;text-overflow:ellipsis;white-space:nowrap}.record-copy span{color:var(--muted);font-size:11px}.record-amount{flex:0 0 auto;text-align:right}.record-amount strong{display:block;margin-bottom:5px;font-size:13px}.record-amount button{border:0;padding:0;color:#9ba6b5;background:transparent;font-size:10px}.empty{padding:28px 0 32px;text-align:center;color:var(--muted)}.empty b{display:grid;width:48px;height:48px;margin:0 auto 10px;place-items:center;border-radius:17px;color:#9aa9bc;background:#f1f4f8}.empty p{margin:0;font-size:13px}.tool,.install{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.9)}.tool{display:flex;align-items:center;justify-content:space-between;gap:12px}.tool-copy{display:flex;align-items:center;gap:11px;min-width:0}.tool-icon{display:grid;flex:0 0 auto;width:40px;height:40px;place-items:center;border-radius:14px;color:#24835f;background:#e4f7ef;font-size:12px;font-weight:800}.tool strong{display:block;font-size:13px}.tool p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.45}.tool>button{flex:0 0 auto;border:0;padding:9px 12px;border-radius:12px;color:var(--blue);background:var(--blue-soft);font-size:11px;font-weight:750}.install{border-style:dashed;background:rgba(236,242,255,.58)}.install span{color:var(--blue-dark);font-size:12px;font-weight:750}.install p{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.55}footer{padding:20px 0 3px;color:#97a2b1;text-align:center;font-size:10px}.backdrop{position:fixed;z-index:20;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-top:40px;background:rgba(13,21,35,.43);backdrop-filter:blur(4px)}.sheet{width:min(100%,520px);max-height:92vh;padding:10px 20px calc(22px + env(safe-area-inset-bottom));overflow-y:auto;border-radius:30px 30px 0 0;background:#fff;box-shadow:0 -20px 60px rgba(13,21,35,.18);animation:rise .24s ease-out}@keyframes rise{from{transform:translateY(30px);opacity:.5}}.handle{width:42px;height:5px;margin:0 auto 17px;border-radius:999px;background:#d8dde5}.sheet h2{margin:0;font-size:22px}.close{width:36px;height:36px;border:0;border-radius:50%;color:#78879a;background:#f1f4f8;font-size:22px}.raw{margin:14px 0;padding:11px 13px;border-radius:13px;color:#617087;background:#f4f7fb;font-size:12px}.field,.cats legend{display:block;margin-top:16px;color:#4e5d70;font-size:12px;font-weight:700}.field>input,.amount-wrap{display:flex;width:100%;height:52px;margin-top:7px;align-items:center;border:1px solid #dfe5ed;border-radius:15px;color:var(--ink);background:#fff;outline:none}.field>input{padding:0 15px}.field>input:focus,.amount-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,107,255,.1)}.amount-wrap b{padding-left:15px;font-size:20px}.amount-wrap input{min-width:0;flex:1;border:0;padding:0 15px 0 8px;outline:none;font-size:24px;font-weight:750}.cats{margin:0;padding:0;border:0}.cats>div{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.cats button{padding:9px 3px;border:1px solid #e3e8f0;border-radius:13px;color:#5d6c7e;background:#fff;font-size:11px}.cats button b{display:block;margin-bottom:3px}.cats button.selected{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}.save{width:100%;height:54px;margin-top:21px;border:0;border-radius:17px;color:#fff;background:linear-gradient(135deg,#3d76ff,#2355d5);font-weight:750;box-shadow:0 12px 25px rgba(47,107,255,.23)}.toast{position:fixed;z-index:50;left:50%;bottom:calc(25px + env(safe-area-inset-bottom));max-width:calc(100% - 36px);padding:11px 16px;border-radius:999px;color:#fff;background:rgba(22,30,43,.92);box-shadow:0 12px 30px rgba(0,0,0,.18);font-size:12px;transform:translateX(-50%)}.hidden{display:none!important}@media(min-width:700px){.app{padding-top:34px}.backdrop{align-items:center}.sheet{border-radius:30px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar row"><div><p class="eyebrow">仅保存在这台手机</p><h1>语音记账</h1></div><button class="privacy" id="privacy" aria-label="隐私说明">私</button></header>
    <section class="summary" aria-label="本月支出概览"><div class="summary-head row"><span>本月支出</span><span id="monthCount">0 笔</span></div><strong id="monthTotal">¥0.00</strong><div class="chips" id="chips"><span>说一句“午饭28元”开始记账</span></div></section>
    <section class="voice" id="voiceCard"><div class="rings"><i></i><i></i><i></i></div><button class="mic" id="mic" aria-label="开始语音记账"><span>●</span></button><h2 id="voiceTitle">点一下，说出消费</h2><p id="voiceTip">点一下，说“打车35元”</p><button class="manual" id="manual">手动记一笔</button></section>
    <section class="records"><div class="section-title row"><h2>最近账单</h2><span id="recordCount">暂无记录</span></div><div id="recordList"></div></section>
    <section class="tool"><div class="tool-copy"><span class="tool-icon">表</span><div><strong>导出给 Numbers</strong><p>随时备份为表格，不影响手机里的记录。</p></div></div><button id="export">导出账单</button></section>
    <section class="install"><span>添加到 iPhone 桌面</span><p>在 Safari 点底部“分享”，选择“添加到主屏幕”。以后直接点图标记账。</p></section>
    <footer>本地保存 · 不登录 · 不上传账单</footer>
  </main>
  <div class="backdrop hidden" id="backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="handle"></div><div class="row"><div><p class="eyebrow">请确认识别结果</p><h2 id="sheetTitle">这笔消费对吗？</h2></div><button class="close" id="close" aria-label="关闭">×</button></div><p class="raw hidden" id="raw"></p><label class="field">消费项目<input id="item" placeholder="例如：午饭" autocomplete="off"></label><label class="field">金额<span class="amount-wrap"><b>¥</b><input id="amount" placeholder="0.00" inputmode="decimal"></span></label><fieldset class="cats"><legend>分类</legend><div id="catButtons"></div></fieldset><button class="save" id="save">确认记账</button></section></div>
  <div class="toast hidden" id="toast" role="status"></div>
  <script>
    const KEY='voice-ledger-transactions-v2';
    const cats=['餐饮','交通','购物','娱乐','居住','医疗','学习','其他'];
    const icons={餐饮:'餐',交通:'行',购物:'购',娱乐:'乐',居住:'住',医疗:'医',学习:'学',其他:'其'};
    const words={餐饮:['饭','餐','早餐','午餐','晚餐','外卖','咖啡','奶茶','水果'],交通:['打车','出租','地铁','公交','停车','加油','高铁','机票'],购物:['买','淘宝','京东','衣服','日用品','超市'],娱乐:['电影','游戏','唱歌','ktv','会员','门票'],居住:['房租','水费','电费','燃气','物业','网费'],医疗:['药','医院','挂号','体检','诊所'],学习:['书','课程','培训','学习','学费'],其他:[]};
    const money=new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY',minimumFractionDigits:2});
    let list=[];try{list=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
    let draft=null,recognition=null,toastTimer=null;
    const $=s=>document.querySelector(s);
    function toast(text){const el=$('#toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2600)}
    function saveLocal(){localStorage.setItem(KEY,JSON.stringify(list))}
    function infer(text){const n=text.toLowerCase();for(const c of cats){if(words[c].some(w=>n.includes(w)))return c}return'其他'}
    function parse(text){const m=text.match(/\d+(?:\.\d{1,2})?/);const amount=m?m[0]:'';const item=text.replace(/\d+(?:\.\d{1,2})?\s*(元|块钱|块)?/g,'').replace(/[，。,.]/g,' ').trim()||'日常消费';return{item,amount,category:infer(item),raw:text}}
    function thisMonth(date){const d=new Date(date),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()}
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function render(){const month=list.filter(x=>thisMonth(x.createdAt)),total=month.reduce((a,x)=>a+x.amount,0);$('#monthCount').textContent=month.length+' 笔';$('#monthTotal').textContent=money.format(total);const totals={};month.forEach(x=>totals[x.category]=(totals[x.category]||0)+x.amount);const top=Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,3);$('#chips').innerHTML=top.length?top.map(([c,a])=>`<span>${c} ${money.format(a)}</span>`).join(''):'<span>说一句“午饭28元”开始记账</span>';$('#recordCount').textContent=list.length?'共 '+list.length+' 笔':'暂无记录';$('#recordList').innerHTML=list.length?list.slice(0,20).map(x=>`<article class="record"><span class="badge c-${x.category}">${icons[x.category]}</span><div class="record-copy"><strong>${esc(x.item)}</strong><span>${x.category} · ${new Date(x.createdAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div><div class="record-amount"><strong>-${money.format(x.amount)}</strong><button data-delete="${x.id}">删除</button></div></article>`).join(''):'<div class="empty"><b>账</b><p>第一笔账，会从这里开始。</p></div>'}
    function showDraft(d){draft=d;$('#item').value=d.item;$('#amount').value=d.amount;$('#raw').textContent='“'+d.raw+'”';$('#raw').classList.toggle('hidden',d.raw==='手动记录');drawCats();$('#backdrop').classList.remove('hidden');setTimeout(()=>$('#amount').focus(),100)}
    function drawCats(){$('#catButtons').innerHTML=cats.map(c=>`<button type="button" data-cat="${c}" class="${draft.category===c?'selected':''}"><b>${icons[c]}</b>${c}</button>`).join('')}
    function closeDraft(){draft=null;$('#backdrop').classList.add('hidden')}
    function startVoice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){showDraft({item:'',amount:'',category:'其他',raw:'手动记录'});toast('当前浏览器未开放语音识别，已切换为手动输入');return}recognition=new R();recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onstart=()=>{$('#voiceCard').classList.add('listening');$('#mic span').textContent='■';$('#voiceTitle').textContent='正在听…';$('#voiceTip').textContent='例如：午饭二十八元'};recognition.onend=()=>{$('#voiceCard').classList.remove('listening');$('#mic span').textContent='●';$('#voiceTitle').textContent='点一下，说出消费';$('#voiceTip').textContent='点一下，说“打车35元”'};recognition.onerror=()=>toast('没有听清，再说一次试试');recognition.onresult=e=>{const t=e.results[0][0].transcript.trim();if(t)showDraft(parse(t))};recognition.start()}
    $('#mic').onclick=()=>$('#voiceCard').classList.contains('listening')?recognition&&recognition.stop():startVoice();
    $('#manual').onclick=()=>showDraft({item:'',amount:'',category:'其他',raw:'手动记录'});$('#close').onclick=closeDraft;$('#backdrop').onclick=e=>{if(e.target===e.currentTarget)closeDraft()};
    $('#catButtons').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){draft.category=b.dataset.cat;drawCats()}};
    $('#save').onclick=()=>{const item=$('#item').value.trim(),amount=Number($('#amount').value);if(!item)return toast('请填写消费项目');if(!Number.isFinite(amount)||amount<=0)return toast('请填写正确金额');const x={id:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),createdAt:new Date().toISOString(),item,category:draft.category,amount,raw:draft.raw};list.unshift(x);saveLocal();render();closeDraft();toast('已记账：'+item+' '+money.format(amount))};
    $('#recordList').onclick=e=>{const b=e.target.closest('[data-delete]');if(b&&confirm('确定删除这笔账单吗？')){list=list.filter(x=>x.id!==b.dataset.delete);saveLocal();render();toast('账单已删除')}};
    $('#privacy').onclick=()=>toast('数据只保存在当前浏览器中');
    $('#export').onclick=async()=>{if(!list.length)return toast('还没有可以导出的账单');const q=v=>'"'+String(v).replaceAll('"','""')+'"';const rows=[['时间','项目','分类','金额','原始语音'],...list.map(x=>[new Date(x.createdAt).toLocaleString('zh-CN'),x.item,x.category,x.amount.toFixed(2),x.raw])];const csv='\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\n'),name='语音记账-'+new Date().toISOString().slice(0,10)+'.csv',file=new File([csv],name,{type:'text/csv;charset=utf-8'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'语音记账账单'});return}}catch(e){if(e.name==='AbortError')return}const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);toast('账单已导出，可用 Numbers 打开')};
    render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  </script>
</body>
</html>
