<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业运营岗味地图｜2027/2028求职工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#203044;font:14px system-ui,-apple-system,'Microsoft YaHei',sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.head h1{margin:0 0 7px;font-size:26px}.muted{color:#748399;font-size:12px}.btn{display:inline-block;text-decoration:none;border:1px solid #dce5ef;background:white;color:#183d69;border-radius:9px;padding:9px 12px}.notice{background:#fffbea;border:1px solid #eadca2;color:#6d5b12;padding:12px 14px;border-radius:12px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.panel{background:white;border:1px solid #e2e9f1;border-radius:13px;padding:15px;box-shadow:0 6px 20px #1733570c}.card b{display:block;font-size:26px;color:#174b84;margin-top:5px}.panel{margin-top:14px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px;margin-bottom:12px}input,select{width:100%;padding:9px;border:1px solid #dce5ef;border-radius:8px;background:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.company{background:white;border:1px solid #e2e9f1;border-radius:12px;padding:15px}.company h3{margin:0 0 6px;font-size:17px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.tag{padding:4px 8px;border-radius:99px;background:#eaf2ff;color:#245b95;font-size:11px}.tag.game{background:#f0ebff;color:#6847a8}.tag.high{background:#e9f7ef;color:#28704a}.prep{background:#f8fafc;border-radius:8px;padding:9px;margin-top:8px;line-height:1.6}.kw{font-size:12px;color:#596b80;line-height:1.7}.empty{text-align:center;color:#7c8999;padding:30px}@media(max-width:800px){.stats,.grid,.filters{grid-template-columns:1fr}.head{display:block}.head .btn{margin-top:10px}}</style></head><body><div class="wrap"><div class="head"><div><h1>企业 × 运营岗味地图</h1><div class="muted">2027/2028届大厂中厂招聘工作台 · 运营方向专项</div></div><a class="btn" href="./">← 返回完整招聘工作台</a></div><div class="notice">这里整理的是“企业适配的运营岗位画像”，不是当前招聘状态。真实可投岗位仍以主工作台招聘信息池和企业官方招聘页面为准；本页用于选公司、定简历方向、准备项目经历与面经。</div><div class="stats" id="stats"></div><div class="panel"><div class="filters"><input id="q" placeholder="搜索公司 / 岗味 / 关键词"><select id="sector"><option value="">全部赛道</option></select><select id="op"><option value="">全部运营方向</option></select><select id="pri"><option value="">全部优先级</option><option>高</option><option>中高</option><option>中</option></select></div><div class="grid" id="grid"></div></div></div><script>let D=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let r=await fetch('./data/company_ops_map.json?v='+Date.now());let x=await r.json();D=x.companies||[];fill();render()}function fill(){let sectors=[...new Set(D.map(x=>x.sector))].sort(),ops=[...new Set(D.flatMap(x=>x.ops))].sort();sector.innerHTML='<option value="">全部赛道</option>'+sectors.map(x=>`<option>${esc(x)}</option>`).join('');op.innerHTML='<option value="">全部运营方向</option>'+ops.map(x=>`<option>${esc(x)}</option>`).join('')}function render(){let qq=q.value.trim().toLowerCase(),s=sector.value,o=op.value,p=pri.value;let a=D.filter(x=>(!qq||JSON.stringify(x).toLowerCase().includes(qq))&&(!s||x.sector===s)&&(!o||x.ops.includes(o))&&(!p||x.priority===p));let game=D.filter(x=>/游戏/.test(x.sector)).length,high=D.filter(x=>x.priority==='高').length,opn=new Set(D.flatMap(x=>x.ops)).size;stats.innerHTML=`<div class="card">企业画像总数<b>${D.length}</b></div><div class="card">游戏相关企业<b>${game}</b></div><div class="card">高优先级企业<b>${high}</b></div><div class="card">运营细分方向<b>${opn}</b></div>`;grid.innerHTML=a.length?a.map(x=>`<article class="company"><h3>${esc(x.company)} <span class="tag high">${esc(x.priority)}优先</span></h3><div class="muted">${esc(x.tier)} · ${esc(x.sector)}</div><div class="tags">${x.ops.map(y=>`<span class="tag ${/游戏|发行|社区/.test(y)&&/游戏/.test(x.sector)?'game':''}">${esc(y)}</span>`).join('')}</div><div class="kw"><b>JD岗味：</b>${x.keywords.map(esc).join(' · ')}</div><div class="prep"><b>准备重点：</b>${esc(x.prep)}</div></article>`).join(''):'<div class="empty">没有符合筛选条件的企业。</div>'}['q','sector','op','pri'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render));load().catch(e=>grid.innerHTML='<div class="empty">运营岗味数据加载失败，请刷新重试。</div>')</script></body></html>
