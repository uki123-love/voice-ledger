name: Update math exam workbench data
on:
  workflow_dispatch:
  schedule:
    - cron: '20 1,9 * * *'
  push:
    paths:
      - 'math-exam-workbench/**'
      - '.github/workflows/update-math-exam-workbench.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: math-exam-workbench/requirements.txt
      - run: pip install -r math-exam-workbench/requirements.txt
      - run: python math-exam-workbench/collector.py
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add math-exam-workbench/data/jobs.json
          git diff --cached --quiet || git commit -m "chore: update 2028 recruitment data"
          git push
